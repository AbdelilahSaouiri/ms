spring.application.name=customer-service
server.port=8081
spring.cloud.stream.bindings.customerEvent-out-0.destination=${TOPIC_CUSTOMER}
spring.docker.compose.file=classpath:compose.yaml
spring.docker.compose.lifecycle-management=start_only
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8080/realms/gateway}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8080/realms/gateway/protocol/openid-connect/certs}

eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/
spring.cloud.vault.enabled=false
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=customer-service





